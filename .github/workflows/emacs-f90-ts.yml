name: emacs f90-mode

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      matrix:
        include:
          # Emacs 29.1 built against Tree-sitter 0.20.8:
          # exercises the baseline ABI 13-14 environment.
          - emacs-version: "29.1"
            emacs-install: source
            tree-sitter-version: "0.20.8"
            tree-sitter-abi: "14"

          # Emacs 29.3 (Ubuntu 24.04 default package). At runtime this
          # links against whatever libtree-sitter apt installs (0.20.8,
          # ABI 13-14) - that is fixed by Ubuntu, not by this matrix.
          # tree-sitter-version below selects only the tree-sitter-cli
          # release used to generate the grammar: 0.24.7 emits ABI 14,
          # which matches the linked 0.20.8 library.
          - emacs-version: "29.3"
            emacs-install: apt
            tree-sitter-version: "0.24.7"
            tree-sitter-abi: "14"

          # Emacs 30.1 built against Tree-sitter 0.24:
          # exercises the ABI-14 environment shipped by Emacs 30.
          - emacs-version: "30.1"
            emacs-install: source
            tree-sitter-version: "0.24.7"
            tree-sitter-abi: "14"

          # Emacs 30.1 built against Tree-sitter 0.25:
          # exercises the ABI-15 environment commonly found in
          # self-built Emacs 30 installations.
          - emacs-version: "30.1"
            emacs-install: source
            tree-sitter-version: "0.25.10"
            tree-sitter-abi: "15"

          # Emacs 30.2 built against Tree-sitter 0.24:
          # ABI-14 environment.
          - emacs-version: "30.2"
            emacs-install: source
            tree-sitter-version: "0.24.7"
            tree-sitter-abi: "14"

          # Emacs 30.2 built against Tree-sitter 0.25:
          # ABI-15 environment.
          - emacs-version: "30.2"
            emacs-install: source
            tree-sitter-version: "0.25.10"
            tree-sitter-abi: "15"

          # Emacs 31: use Purcell's precompiled Emacs.
          # Current Purcell build uses Tree-sitter 0.26.x,
          # which supports ABI 15.
          - emacs-version: "31.1"
            emacs-install: purcell
            tree-sitter-version: "0.26.11"
            tree-sitter-abi: "15"

    steps:
      # -------------------------
      # Checkout repo
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # -------------------------
      # Install common dependencies
      # -------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            pkg-config \
            npm \
            curl

      # -------------------------
      # Install Emacs (Ubuntu package)
      # -------------------------
      - name: Install Emacs (Ubuntu package)
        if: matrix.emacs-install == 'apt'
        run: |
          sudo apt-get install -y emacs-nox

      # -------------------------
      # Install dependencies needed
      # for building Emacs from source
      # -------------------------
      - name: Install Emacs build dependencies
        if: matrix.emacs-install == 'source'
        run: |
          sudo apt-get install -y \
            autoconf \
            automake \
            texinfo \
            libjansson-dev \
            libgnutls28-dev \
            libncurses-dev \
            libgccjit-13-dev

      # -------------------------
      # Build Tree-sitter
      # -------------------------
      #
      # The Tree-sitter version here determines the ABI range
      # supported by the Emacs binary:
      #
      #   0.24.x -> ABI 13-14
      #   0.25.x -> ABI 13-15
      #
      - name: Build tree-sitter ${{ matrix.tree-sitter-version }}
        if: matrix.emacs-install == 'source'
        run: |
          git clone \
            --depth 1 \
            --branch v${{ matrix.tree-sitter-version }} \
            https://github.com/tree-sitter/tree-sitter.git

          cd tree-sitter

          make -j$(nproc)
          make PREFIX=$HOME/local install

          echo "LD_LIBRARY_PATH=$HOME/local/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$HOME/local/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "CPATH=$HOME/local/include:$CPATH" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$HOME/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      # -------------------------
      # Build Emacs from source
      # -------------------------
      - name: Build Emacs ${{ matrix.emacs-version }}
        if: matrix.emacs-install == 'source'
        run: |
          git clone \
            --depth 1 \
            --branch emacs-${{ matrix.emacs-version }} \
            https://github.com/emacs-mirror/emacs.git

          cd emacs

          ./autogen.sh

          ./configure \
            LDFLAGS="-Wl,-rpath,$HOME/local/lib" \
            CPPFLAGS="-I$HOME/local/include" \
            --prefix=$HOME/emacs \
            --with-tree-sitter \
            --with-gnutls \
            --without-x \
            --without-sound \
            --without-sqlite3 \
            --without-xml2 \
            --without-mailutils \
            --without-pop \
            --without-native-compilation \
            --without-compress-install \
            CFLAGS="-O2"

          make -j$(nproc)
          make install

          echo "$HOME/emacs/bin" >> "$GITHUB_PATH"

      # -------------------------
      # Install Emacs via Purcell
      # -------------------------
      - name: Install Emacs 31
        if: matrix.emacs-install == 'purcell'
        uses: purcell/setup-emacs@master
        with:
          version: '31.1'

      # -------------------------
      # Verify Emacs
      # -------------------------
      - name: Verify Emacs
        run: |
          which emacs
          emacs --version

      - name: Verify Ubuntu Emacs version
        if: matrix.emacs-install == 'apt'
        run: |
          case "$(emacs --version | head -n1)" in
            "GNU Emacs 29."*) ;;
            *)
              echo "Error: Ubuntu did not install Emacs 29.x"
              exit 1
              ;;
          esac

      # -------------------------
      # Verify Tree-sitter support
      # -------------------------
      #
      # Print both ends of the ABI range. This is the important
      # compatibility information, rather than the exact
      # Tree-sitter release number.
      #
      - name: Verify Tree-sitter ABI
        run: |
          emacs --batch -Q \
            --eval "(progn
              (princ (format \"Emacs: %s\n\" emacs-version))
              (princ
               (format
                \"Tree-sitter ABI minimum: %s\n\"
                (treesit-library-abi-version t)))
              (princ
               (format
                \"Tree-sitter ABI maximum: %s\n\"
                (treesit-library-abi-version)))

              (unless (treesit-available-p)
                (error \"Tree-sitter is not available\")))"

      # -------------------------
      # Verify expected ABI
      # -------------------------
      - name: Verify expected Tree-sitter ABI (Ubuntu package)
        if: matrix.emacs-install == 'apt'
        run: |
          ACTUAL_MIN_ABI=$(
            emacs --batch -Q \
              --eval '(princ (treesit-library-abi-version t))'
          )

          ACTUAL_MAX_ABI=$(
            emacs --batch -Q \
              --eval '(princ (treesit-library-abi-version))'
          )

          echo "Expected ABI range: 13-14"
          echo "Actual minimum ABI: $ACTUAL_MIN_ABI"
          echo "Actual maximum ABI: $ACTUAL_MAX_ABI"

          if [ "$ACTUAL_MIN_ABI" != "13" ] || [ "$ACTUAL_MAX_ABI" != "14" ]; then
            echo "Error: unexpected Tree-sitter ABI range"
            exit 1
          fi

      - name: Verify expected Tree-sitter ABI (built/precompiled Emacs)
        if: matrix.emacs-install != 'apt'
        run: |
          ACTUAL_ABI=$(
            emacs --batch -Q \
              --eval '(princ (treesit-library-abi-version))'
          )

          echo "Expected maximum ABI: ${{ matrix.tree-sitter-abi }}"
          echo "Actual maximum ABI:   $ACTUAL_ABI"

          if [ "$ACTUAL_ABI" != "${{ matrix.tree-sitter-abi }}" ]; then
            echo "Error: unexpected Tree-sitter ABI"
            exit 1
          fi

      # -------------------------
      # Verify Emacs tree-sitter linkage
      # -------------------------
      - name: Verify tree-sitter linkage
        if: matrix.emacs-install != 'purcell'
        run: |
          EMACS_BIN=$(which emacs)

          echo "Emacs binary: $EMACS_BIN"

          LDD_OUT=$(ldd "$EMACS_BIN" | grep libtree-sitter || true)

          echo "tree-sitter linkage:"
          echo "$LDD_OUT"

          if [ -z "$LDD_OUT" ]; then
            echo "Error: Emacs is not linked against libtree-sitter"
            exit 1
          fi

      #
      # This is informational for the Purcell binary. The important
      # verification is the ABI reported by the running Emacs above.
      #
      - name: Verify precompiled Emacs tree-sitter linkage
        if: matrix.emacs-install == 'purcell'
        run: |
          EMACS_BIN=$(which emacs)

          echo "Emacs binary: $EMACS_BIN"

          LDD_OUT=$(ldd "$EMACS_BIN" | grep libtree-sitter || true)

          echo "tree-sitter linkage:"
          echo "$LDD_OUT"

          if [ -z "$LDD_OUT" ]; then
            echo "Warning: no libtree-sitter linkage found in ldd."
            echo "The binary may load Tree-sitter another way."
          fi

      # -------------------------
      # Show the Ubuntu tree-sitter package
      # -------------------------
      - name: Verify Ubuntu tree-sitter package
        if: matrix.emacs-install == 'apt'
        run: |
          dpkg-query -W -f='${Package} ${Version}\\n' libtree-sitter0
          apt-cache policy libtree-sitter0

      # -------------------------
      # Install tree-sitter CLI
      # -------------------------
      #
      # This matches the Tree-sitter library used to build/link Emacs,
      # so the generated grammar naturally has the corresponding ABI:
      #
      #   CLI 0.24.x -> grammar ABI 14
      #   CLI 0.25.x -> grammar ABI 15
      #   CLI 0.26.x -> grammar ABI 15
      #
      - name: Install tree-sitter CLI
        run: |
          npm install -g \
            tree-sitter-cli@${{ matrix.tree-sitter-version }}

      # -------------------------
      # Verify tree-sitter CLI
      # -------------------------
      - name: Verify tree-sitter CLI
        run: |
          tree-sitter --version

      # -------------------------
      # Run checks
      # -------------------------
      - name: Run checks
        run: |
          make test-checkdoc
          make test-byte-compile

      # -------------------------
      # Test several grammar revisions
      # -------------------------
      #
      # GRAMMAR_REFS: one ref per line (branch, tag or full commit SHA of
      # mscfd/tree-sitter-fortran). Text after '#' is ignored.
      #
      #   master                      moving target, tests "latest"
      #   emacs-f90-ts-mode-v0.y.x    compatibility tag of the CURRENT f90-ts
      #                               release series 0.y.*; adjust y when a
      #                               grammar change breaks compatibility
      #   <sha>                       temporary checkpoint of an older grammar,
      #                               to check backwards compatibility; remove
      #                               after a few months
      #
      # NOTE: "git clone --branch <sha>" does NOT work (only branch and tag
      # names are accepted), hence init + fetch, which accepts all three.
      # A failure in one revision does not stop the others from running.
      #
      - name: Test grammar versions
        env:
          GRAMMAR_REFS: |
            emacs-f90-ts-mode-v0.7.x
            7ff6e504bed78ca71828c8a086bc12b3603bd476   # older version, temporary checkpoint for backwards compatibility
        run: |
          failed=""
          refs=$(printf '%s\n' "$GRAMMAR_REFS" | sed 's/#.*//' | awk 'NF { print $1 }')

          for ref in $refs; do
            echo
            echo "========================================"
            echo "Testing grammar ref: $ref"
            echo "========================================"

            if ! (
              set -e
              mkdir -p ~/.emacs.d/tree-sitter
              rm -rf tree-sitter-fortran
              git init -q tree-sitter-fortran
              cd tree-sitter-fortran
              git remote add origin https://github.com/mscfd/tree-sitter-fortran.git
              git fetch --depth 1 origin "$ref"
              git checkout -q FETCH_HEAD
              echo "Grammar ref:    $ref"
              echo "Grammar commit: $(git rev-parse HEAD)"

              # Regenerate the parser with the CLI selected by the matrix,
              # so that the grammar ABI matches the Emacs under test.
              tree-sitter generate
              grep -q "#define LANGUAGE_VERSION ${{ matrix.tree-sitter-abi }}" src/parser.c \
                || { echo "Error: generated grammar has unexpected ABI"; exit 1; }

              OUT_SO="$HOME/.emacs.d/tree-sitter/libtree-sitter-fortran.so"
              if tree-sitter build --help >/dev/null 2>&1; then
                tree-sitter build --output "$OUT_SO"
              elif [ -f src/scanner.c ]; then
                gcc -O2 -shared -fPIC -I src src/parser.c src/scanner.c -o "$OUT_SO"
              else
                gcc -O2 -shared -fPIC -I src src/parser.c -o "$OUT_SO"
              fi

              cd ..
              make test-ert
            ); then
              failed="$failed $ref"
            fi
          done

          if [ -n "$failed" ]; then
            echo "FAILED grammar refs:$failed"
            exit 1
          fi
